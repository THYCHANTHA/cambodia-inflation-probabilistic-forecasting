[project]
name = "cambodia-inflation"
version = "0.1.0"
description = "Probabilistic forecasting of Phnom Penh consumer price inflation (research code)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM", "RUF"]
